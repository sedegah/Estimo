# Copy to worker/wrangler.toml and fill in your own database id.
name = "estimo-monthly-email"
main = "index.ts"
compatibility_date = "2026-11-16"

[[d1_databases]]
binding = "DB"
database_name = "estimo"
database_id = "YOUR_D1_DATABASE_ID"

# 00:00 UTC on the 17th of every month (Ghana is UTC+0, so this is local midnight).
[triggers]
crons = ["0 0 17 * *"]
