<!-- ESTIMO email signature. Paste the table below into your mail client's signature editor. -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',Arial,sans-serif;color:#0b1f3f;">
  <tr>
    <td style="padding-right:16px;border-right:2px solid #f5b301;vertical-align:middle;">
      <a href="{{APP_URL}}" style="text-decoration:none;">
        <img src="{{APP_URL}}/brand/estimo-mark-light.png" width="44" height="44" alt="ESTIMO" style="display:block;border:0;width:44px;height:44px;">
      </a>
    </td>
    <td style="padding-left:16px;vertical-align:middle;">
      <p style="margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#0b1f3f;">{{FULL_NAME}}</p>
      <p style="margin:3px 0 0;font-size:12px;line-height:1.5;color:#5f6b7a;">{{ROLE}} &middot; ESTIMO</p>
      <p style="margin:7px 0 0;font-size:12px;line-height:1.5;color:#5f6b7a;">
        <a href="mailto:{{EMAIL}}" style="color:#0b1f3f;text-decoration:none;">{{EMAIL}}</a>
        &nbsp;&middot;&nbsp;
        <a href="tel:{{PHONE}}" style="color:#0b1f3f;text-decoration:none;">{{PHONE}}</a>
        &nbsp;&middot;&nbsp;
        <a href="{{APP_URL}}" style="color:#0b1f3f;text-decoration:none;">{{DOMAIN}}</a>
      </p>
      <p style="margin:7px 0 0;font-size:11px;line-height:1.5;color:#8a94a3;">Ghana electrical estimates &mdash; picture it lit, then price it.</p>
    </td>
  </tr>
</table>
