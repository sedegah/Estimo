name: Deploy admin console

# The desktop app loads the console from this worker, so this deploy is what makes
# interface changes appear in the app after a reload (Ctrl+R).
#
# Repository secrets needed:
#   CLOUDFLARE_API_TOKEN        token with "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID       065fc200f5c2cb1f51dd59426f19012c
#   ADMIN_CLERK_PUBLISHABLE_KEY pk_test_...
#   ADMIN_CLERK_SECRET_KEY      sk_test_...
#
# Without CLOUDFLARE_API_TOKEN the job fails fast; deploying by hand still works:
#   cd admin && npm run deploy

on:
  push:
    branches: [master]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and deploy
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.ADMIN_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.ADMIN_CLERK_SECRET_KEY }}
          NEXT_PUBLIC_ESTIMO_API_URL: ${{ vars.ESTIMO_API_URL || 'https://estimo-api.sedegahkimathi.workers.dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
